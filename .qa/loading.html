<section aria-label="Loading CodeBreakers" aria-busy="true" class="screen helm-keep" id="bootScreen">
  <div class="boot-content">
    <div class="boot-emblem" aria-hidden="true">
      <span class="boot-orbit boot-orbit-outer"></span>
      <span class="boot-orbit boot-orbit-inner"></span>
      <span class="boot-emblem-glow"></span>
      <img class="boot-logo" alt="" data-helm-logo="" width="100" height="100"/>
    </div>
    <p class="boot-kicker"><span></span>CODEBREAKERS OS / INITIALIZING</p>
    <div class="loading-logo">CODE<span>BREAKERS</span></div>
    <h2 id="bootTitle" tabindex="-1">Preparing your next mission</h2>
    <p class="boot-description">Synchronizing the Code Lab, combat systems and learning grid.</p>
    <div class="boot-progress-panel">
      <div class="boot-progress-heading"><span>SYSTEM STARTUP</span><strong id="loadPercent">0%</strong></div>
      <div class="loading-track" id="bootProgress" role="progressbar" aria-label="Startup progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="loadFill"></div>
      </div>
      <p class="bootline" id="bootText" role="status" aria-live="polite">Initializing command engine...</p>
    </div>
    <div class="boot-foot"><span></span>CODEBREAKERS OS · SIMULATION MODE<span></span></div>
  </div>
</section>
